# DVC pipeline. Each stage declares inputs (deps/params) and outputs (outs).
# DVC hashes all of them into dvc.lock, so the exact state that produced a
# given merged_dataset is recoverable from git.
#
#   dvc repro          -> re-run stages whose deps/params changed
#   dvc status         -> show what is stale
#   dvc dag            -> show the dependency graph
stages:
  content-index:
    cmd: python3 scripts/content_index.py
    deps:
      - scripts/content_index.py
      - scripts/dataset_io.py
      - scripts/analyze_duplicate_images.py
      - scripts/detect_duplicate_images.py
      - data/kaggle_dataset/convertido
      - data/roboflow_convertido/merged
      - data/trashbox/TrashBox_train_set
      - data/trashnet/dataset-resized
    outs:
      - data/content_index.csv
      - reports/content_index/unreadable_images.csv

  global-split-registry:
    cmd: >-
      python3 scripts/global_split_registry.py
      --seed ${registry.seed}
      --val-ratio ${registry.val_ratio}
      --test-ratio ${registry.test_ratio}
    deps:
      - scripts/global_split_registry.py
      - scripts/dataset_io.py
      - scripts/merge_datasets.py
      - data/content_index.csv
    params:
      - registry.seed
      - registry.val_ratio
      - registry.test_ratio
    outs:
      - data/global_split_registry.csv
      - reports/global_split_registry/excluded_ambiguous_clusters.csv

  merge:
    cmd: >-
      python3 scripts/merge_datasets.py
      --overwrite
      --seed ${merge.seed}
      --val-ratio ${merge.val_ratio}
      --test-ratio ${merge.test_ratio}
    deps:
      - scripts/merge_datasets.py
      - data/trashnet/dataset-resized
      - data/kaggle_dataset/convertido
      - data/trashbox/TrashBox_train_set
      - data/roboflow_convertido/merged
    params:
      - merge.seed
      - merge.val_ratio
      - merge.test_ratio
    outs:
      - data/merged_dataset
