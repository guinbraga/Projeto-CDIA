# DVC pipeline. Each stage declares inputs (deps/params) and outputs (outs).
# DVC hashes all of them into dvc.lock, so the exact state that produced a
# given merged_dataset is recoverable from git.
#
# The pipeline rebuilds raw sources -> content index -> global split registry
# -> four source splits -> merged dataset -> verification. The verify stage is
# a hard gate: it re-validates the merge balance contract and the cross-dataset
# isolation invariant, and must pass before the pipeline is reproducible.
#
#   dvc repro          -> re-run stages whose deps/params changed
#   dvc status         -> show what is stale
#   dvc dag            -> show the dependency graph
stages:
  content-index:
    cmd: python3 scripts/content_index.py
    deps:
      - scripts/content_index.py
      - scripts/dataset_io.py
      - scripts/analyze_duplicate_images.py
      - scripts/detect_duplicate_images.py
      - data/kaggle_dataset/convertido
      - data/roboflow_convertido/merged
      - data/trashbox/TrashBox_train_set
      - data/trashnet/dataset-resized
    outs:
      - data/content_index.csv
      - reports/content_index/unreadable_images.csv

  global-split-registry:
    cmd: >-
      python3 scripts/global_split_registry.py
      --seed ${registry.seed}
      --val-ratio ${registry.val_ratio}
      --test-ratio ${registry.test_ratio}
    deps:
      - scripts/global_split_registry.py
      - scripts/dataset_io.py
      - scripts/merge_datasets.py
      - data/content_index.csv
    params:
      - registry.seed
      - registry.val_ratio
      - registry.test_ratio
    outs:
      - data/global_split_registry.csv
      - reports/global_split_registry/excluded_ambiguous_clusters.csv

  source-splits:
    cmd: >-
      python3 scripts/split_dataset.py
      --registry data/global_split_registry.csv
      --content-index data/content_index.csv
      --overwrite
    deps:
      - scripts/split_dataset.py
      - scripts/dataset_io.py
      - data/global_split_registry.csv
      - data/content_index.csv
      - data/kaggle_dataset/convertido
      - data/roboflow_convertido/merged
      - data/trashbox/TrashBox_train_set
      - data/trashnet/dataset-resized
    outs:
      - data/trashnet_split
      - data/kaggle_dataset_split
      - data/trashbox_split
      - data/roboflow_convertido_split

  merge:
    cmd: >-
      python3 scripts/merge_datasets.py
      --overwrite
      --seed ${merge.seed}
      --registry data/global_split_registry.csv
    deps:
      - scripts/merge_datasets.py
      - scripts/dataset_io.py
      - data/global_split_registry.csv
      - data/trashnet_split
      - data/kaggle_dataset_split
      - data/trashbox_split
      - data/roboflow_convertido_split
    params:
      - merge.seed
    outs:
      - data/merged_dataset

  verify:
    cmd: >-
      python3 scripts/merge_datasets.py
      --verify-existing data/merged_dataset
      --seed ${merge.seed}
      --registry data/global_split_registry.csv &&
      python3 scripts/verify_dataset_isolation.py
      --registry data/global_split_registry.csv
      --merged data/merged_dataset
    deps:
      - scripts/merge_datasets.py
      - scripts/verify_dataset_isolation.py
      - data/global_split_registry.csv
      - data/trashnet_split
      - data/kaggle_dataset_split
      - data/trashbox_split
      - data/roboflow_convertido_split
      - data/merged_dataset
    params:
      - merge.seed
